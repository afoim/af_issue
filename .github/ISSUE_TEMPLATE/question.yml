name: 使用咨询
description: 询问功能用法、账号、规则或页面操作
title: "[咨询] "
labels:
  - 使用咨询
body:
  - type: markdown
    attributes:
      value: |
        这里用于询问如何使用本站功能、账号或相关规则。
        如果你遇到页面报错或功能失效，请改用“问题反馈”；如果疑似安全漏洞，请通过仓库 Security → Advisories 私密提交。

        请不要填写密码、Token、Cookie、验证码或其他敏感信息。

  - type: checkboxes
    id: domain_scope
    attributes:
      label: 域名范围确认
      options:
        - label: "我确认本咨询涉及 2x.nz、*.2x.nz、acofork.com 或 *.acofork.com 域名下的项目页面或服务。"
          required: true

  - type: dropdown
    id: site_section
    attributes:
      label: 咨询涉及的区块
      description: 请选择最直接相关的区块；如果同时涉及多个区块，请选择“多个区块/无法确定”。
      options:
        - 主页
        - 博客
        - AI生图
        - 交互小说
        - 追番
        - 工具集
        - 连接
        - 旧站归档
        - 账号
        - 多个区块/无法确定
    validations:
      required: true

  - type: input
    id: related_domain
    attributes:
      label: 相关域名（可选）
      description: 如果咨询涉及某个具体站点，请填写主机名，例如 www.acofork.com 或 status.acofork.com。不要填写包含路径、查询参数、Token 或 Cookie 的完整 URL。
      placeholder: www.acofork.com 或 status.acofork.com

  - type: textarea
    id: question
    attributes:
      label: 具体想咨询什么
      description: 请直接写出你希望了解的问题，尽量一次只咨询一个主题。
      placeholder: 例如：如何查看追番列表中最近更新的番剧？
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 相关背景（可选）
      description: 可说明你想完成的目标、已经进行的操作、看到的提示或尝试过的方法。若有公开页面，也可以附上链接；请先删除敏感信息。

  - type: checkboxes
    id: privacy
    attributes:
      label: 提交确认
      options:
        - label: 我确认内容中不包含密码、Token、Cookie、验证码或不必要的个人信息。
          required: true
