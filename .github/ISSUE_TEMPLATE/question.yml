name: 使用咨询
description: 询问项目功能、使用方法或相关规则
title: "[咨询] "
labels:
  - 使用咨询
body:
  - type: markdown
    attributes:
      value: |
        请先说明你想完成什么，以及目前卡在哪一步。
        
        请不要填写密码、Token、Cookie、验证码或其他敏感信息。

  - type: checkboxes
    id: domain_scope
    attributes:
      label: 域名范围确认
      options:
        - label: "我确认本咨询涉及 2x.nz、*.2x.nz、acofork.com 或 *.acofork.com 域名下的项目页面或服务。"
          required: true

  - type: input
    id: related_domain
    attributes:
      label: 相关域名（可选）
      description: 如果咨询涉及某个具体站点，请填写主机名，例如 www.acofork.com、status.acofork.com。不要粘贴包含路径、查询参数、Token 或 Cookie 的完整 URL。
      placeholder: www.acofork.com 或 status.acofork.com

  - type: input
    id: current_uri
    attributes:
      label: 当前所在页面 URI（高级用户，可选）
      description: 填写你当时打开的完整 URI（包含协议、域名和路径），例如 [https://www.acofork.com/account/](https://www.acofork.com/account/)。若查询参数包含 Token、Cookie、验证码或其他敏感值，请先删除或脱敏。
      placeholder: https://www.acofork.com/account/

  - type: input
    id: failed_uri
    attributes:
      label: 实际失败请求 URI（高级用户，可选）
      description: 如果实际报错的是页面请求的 API 或资源，请填写失败请求的完整 URI，例如 [https://i.2x.nz/api/login](https://i.2x.nz/api/login)。若与当前页面相同可留空；敏感查询参数请先删除或脱敏。
      placeholder: https://i.2x.nz/api/login

  - type: dropdown
    id: request_location
    attributes:
      label: 您当时请求时的地理位置（高级用户，可选）
      description: 请选择大致区域，不要填写精确地址或 IP。
      options:
        - 中国大陆
        - 非中国大陆

  - type: dropdown
    id: device_type
    attributes:
      label: 您使用的设备（高级用户，可选）
      options:
        - 移动端
        - PC端

  - type: input
    id: browser_version
    attributes:
      label: 您使用的浏览器（高级用户，可选）
      description: 请填写浏览器名称和版本。
      placeholder: Microsoft Edge 版本 151.0.4129.107 (正式版本) (64 位)

  - type: textarea
    id: question
    attributes:
      label: 你的问题
      description: 请清楚描述需要解答的内容
      placeholder: 例如：如何查看生图任务在队列中的位置？
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 补充背景
      description: 可填写相关页面、操作步骤和已经尝试过的方法

  - type: checkboxes
    id: privacy
    attributes:
      label: 提交确认
      options:
        - label: 我确认内容中不包含密码、Token、Cookie、验证码或不必要的个人信息。
          required: true
