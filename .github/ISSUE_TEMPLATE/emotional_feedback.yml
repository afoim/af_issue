name: 情感与项目反馈
description: 分享与 AcoFork 项目、社区或个人体验相关的想法
title: "[反馈] "
labels:
  - 情感问题
body:
  - type: markdown
    attributes:
      value: |
        这里可以分享你对 AcoFork、项目发展、社区互动或使用体验的想法。
        
        请尽量避免填写真实姓名、手机号、地址、账号凭据或其他不必要的个人信息。

  - type: textarea
    id: feedback
    attributes:
      label: 想说些什么
      description: 请写下你的经历、感受或希望得到的回应
      placeholder: 你可以按照自己的方式表达，不必使用技术术语。
    validations:
      required: true

  - type: textarea
    id: response
    attributes:
      label: 希望得到什么回应
      description: 可选，例如希望解释、建议、道歉、改进或仅仅希望被看到

  - type: checkboxes
    id: privacy
    attributes:
      label: 提交确认
      options:
        - label: 我确认内容中不包含密码、Token、Cookie、验证码或不必要的个人信息。
          required: true
