name: 新功能建议
description: 提议新增功能、页面或服务能力
title: "[新功能] "
labels:
  - 新功能
body:
  - type: markdown
    attributes:
      value: |
        这里用于提出新功能或改进建议，不用于报告故障。
        请描述需求和使用场景，不必提供技术实现方案。

        请不要填写密码、Token、Cookie、验证码或其他敏感信息。

  - type: checkboxes
    id: domain_scope
    attributes:
      label: 域名范围确认
      options:
        - label: "我确认本建议针对 2x.nz、*.2x.nz、acofork.com 或 *.acofork.com 域名下的项目页面或服务。"
          required: true

  - type: dropdown
    id: site_section
    attributes:
      label: 建议涉及的区块
      description: 请选择最直接相关的区块；如果同时涉及多个区块，请选择“多个区块/无法确定”。
      options:
        - 主页
        - 博客
        - AI生图
        - 交互小说
        - 追番
        - 工具集
        - 连接
        - 旧站归档
        - 账号
        - 多个区块/无法确定
    validations:
      required: true

  - type: input
    id: related_domain
    attributes:
      label: 相关域名（可选）
      description: 只有建议针对某个具体站点时才填写主机名，例如 www.acofork.com 或 status.acofork.com。不要填写包含路径、查询参数、Token 或 Cookie 的完整 URL。
      placeholder: www.acofork.com 或 status.acofork.com

  - type: textarea
    id: request
    attributes:
      label: 希望新增或改进什么
      description: 用一句话或几句话说明你希望我们增加、修改或优化的内容。
      placeholder: 例如：为追番页面增加按更新时间排序。
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: 使用场景和原因
      description: 你在什么情况下需要它？它能解决什么问题？谁会受益？
      placeholder: 例如：番剧较多时，很难快速找到最近更新的内容。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望效果（可选）
      description: 如果你对交互方式、展示位置或优先级有想法，可以写在这里；不需要提供技术实现方案。

  - type: textarea
    id: references
    attributes:
      label: 参考资料或补充说明（可选）
      description: 可填写示例链接、截图或其他补充信息。请先删除密码、Token、Cookie、验证码和个人隐私。

  - type: checkboxes
    id: privacy
    attributes:
      label: 提交确认
      options:
        - label: 我确认内容中不包含密码、Token、Cookie、验证码或不必要的个人信息。
          required: true
