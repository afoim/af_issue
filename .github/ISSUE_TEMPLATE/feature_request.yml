name: 新功能建议
description: 提议新增功能、页面或服务能力
title: "[新功能] "
labels:
  - 新功能
body:
  - type: markdown
    attributes:
      value: |
        请描述你真正想解决的问题，而不只是提出一个功能名称。
        
        请不要填写密码、Token、Cookie、验证码或其他敏感信息。

  - type: dropdown
    id: area
    attributes:
      label: 相关领域
      options:
        - 博客
        - AI 生图
        - 论坛
        - 账号与登录
        - 计费与积分
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 当前遇到了什么不便？谁会受到影响？
      placeholder: 例如：移动端阅读长文章时，目录不容易展开。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你的建议
      description: 你希望它如何工作？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案
      description: 如果有其他解决方式，也可以写在这里。

  - type: checkboxes
    id: privacy
    attributes:
      label: 提交确认
      options:
        - label: 我确认内容中不包含密码、Token、Cookie、验证码或不必要的个人信息。
          required: true
