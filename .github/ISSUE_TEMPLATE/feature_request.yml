name: 新功能建议
description: 提议新增功能、页面或服务能力
title: "[新功能] "
labels:
  - 新功能
body:
  - type: markdown
    attributes:
      value: |
        请描述你真正想解决的问题，而不只是提出一个功能名称。
        
        请不要填写密码、Token、Cookie、验证码或其他敏感信息。

  - type: checkboxes
    id: domain_scope
    attributes:
      label: 域名范围确认
      options:
        - label: "我确认本建议针对 2x.nz、*.2x.nz、acofork.com 或 *.acofork.com 域名下的项目页面或服务。"
          required: true

  - type: input
    id: related_domain
    attributes:
      label: 相关域名（可选）
      description: 如果建议针对某个具体站点，请填写主机名，例如 `www.acofork.com`、`status.acofork.com`。不要粘贴包含路径、查询参数、Token 或 Cookie 的完整 URL。
      placeholder: www.acofork.com 或 status.acofork.com

  - type: dropdown
    id: area
    attributes:
      label: 相关领域
      options:
        - 博客
        - AI 生图
        - 论坛
        - 账号与登录
        - 计费与积分
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 当前遇到了什么不便？谁会受到影响？
      placeholder: 例如：移动端阅读长文章时，目录不容易展开。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你的建议
      description: 你希望它如何工作？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案
      description: 如果有其他解决方式，也可以写在这里。

  - type: checkboxes
    id: privacy
    attributes:
      label: 提交确认
      options:
        - label: 我确认内容中不包含密码、Token、Cookie、验证码或不必要的个人信息。
          required: true
