name: 问题反馈
description: 报告功能、样式、账号、性能、服务或计费问题
title: "[问题] "
body:
  - type: markdown
    attributes:
      value: |
        感谢你的反馈。请尽量提供可复现的信息。
        
        请不要填写密码、Token、Cookie、验证码、完整支付凭证或其他不必要的个人信息。
        如果是安全漏洞，请前往仓库的 Security → Advisories 私密提交，不要公开发布。
        如果你熟悉浏览器开发者工具，也可以填写下面的高级定位信息，帮助区分当前页面和实际失败请求。

  - type: checkboxes
    id: domain_scope
    attributes:
      label: 域名范围确认
      options:
        - label: "我确认该问题发生在 2x.nz、*.2x.nz、acofork.com 或 *.acofork.com 域名下。"
          required: true

  - type: input
    id: affected_domain
    attributes:
      label: 具体报错域名（可选）
      description: 尽量填写实际报错的主机名，例如 i.2x.nz、api-xxx.acofork.com。只填写域名，不要粘贴包含路径、查询参数、Token 或 Cookie 的完整 URL；无法确定时可填写“不确定”。
      placeholder: i.2x.nz 或 api-xxx.acofork.com

  - type: input
    id: current_uri
    attributes:
      label: 当前所在页面 URI（高级用户，可选）
      description: 填写你当时打开的完整 URI（包含协议、域名和路径），例如 `https://i.2x.nz/account`。若查询参数包含 Token、Cookie、验证码或其他敏感值，请先删除或脱敏。
      placeholder: https://i.2x.nz/account

  - type: input
    id: failed_uri
    attributes:
      label: 实际失败请求 URI（高级用户，可选）
      description: 如果实际报错的是页面请求的 API 或资源，请填写失败请求的完整 URI，例如 `https://api-xxx.acofork.com/auth/login`。若与当前页面相同可留空；敏感查询参数请先删除或脱敏。
      placeholder: https://api-xxx.acofork.com/auth/login

  - type: dropdown
    id: category
    attributes:
      label: 问题类型
      description: 请选择最接近的类型
      options:
        - 功能问题
        - 样式问题
        - 账号问题
        - 性能问题
        - 服务异常
        - 计费问题
        - 其他问题
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请简要说明发生了什么
      placeholder: 例如：点击“生成”后页面一直停留在加载状态。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请按顺序列出能够重现问题的操作
      placeholder: |
        1. 打开……
        2. 点击……
        3. 看到……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
      description: 你原本希望看到什么结果？
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 环境信息
      description: 可填写页面、设备、浏览器或大致发生时间
      placeholder: 例如：ai.2x.nz / Windows 11 / Edge

  - type: textarea
    id: attachments
    attributes:
      label: 截图或补充信息
      description: 可附上截图、脱敏后的日志或其他有助于定位问题的信息
      placeholder: 请先删除密码、Token、Cookie、验证码和个人隐私后再粘贴。

  - type: checkboxes
    id: privacy
    attributes:
      label: 提交确认
      options:
        - label: 我确认内容中不包含密码、Token、Cookie、验证码、私钥、完整支付凭证或不必要的个人信息。
          required: true
        - label: 我确认这不是需要私密提交的安全漏洞。
          required: true
